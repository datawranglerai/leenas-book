    <script

      async
      src="https://gc.zgo.at/count.js"
    ></script>

    <style>
      :root {
        color-scheme: dark;
        background: #000;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #000;
      }

      body {
        overflow: hidden;
      }

      main {
        display: grid;
        width: 100vw;
        height: 100vh;
        place-items: center;
      }

      .presentation {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #000;
      }

      .presentation::after {
        position: absolute;
        right: 0;
        bottom: 0;
        z-index: 1;
        width: max(0px, min(136px, calc(100% - 160px)));
        height: 36px;
        background: #f9fafd;
        content: "";
      }

      .presentation iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      @supports (height: 100dvh) {
        main {
          height: 100dvh;
        }

        .presentation {
          height: 100dvh;
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="Leena Keshishian portfolio">
      <div class="presentation">
        <iframe
          src="https://docs.google.com/presentation/d/e/2PACX-1vRkzjfn8iNTxJeoEU_TjrsGZxizmoWTjAIBdkPVq4NlawK4IRuiV9fwo--Samh4Uqq1iazF7Im8q9wQ/pubembed?start=false&amp;loop=false&amp;delayms=3000"
          title="Leena Keshishian portfolio presentation"
          allow="fullscreen"
          allowfullscreen
        ></iframe>
      </div>
    </main>
  </body>
</html>
